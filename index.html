    <script>
      window.__vite_plugin_react_preamble_installed__ = true;
      if (typeof window.$RefreshReg$ === 'undefined') {
        window.$RefreshReg$ = function() {};
      }
      if (typeof window.$RefreshSig$ === 'undefined') {
        window.$RefreshSig$ = function() { return function(type) { return type; }; };
      }
    </script>
    <script>
      (function() {
        function isWsError(msg) {
          return msg && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('failed to connect') !== -1
          );
        }
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return String((a && (a.message || a)) || ''); }).join(' ');
          if (isWsError(msg)) return;
          origConsoleError.apply(console, arguments);
        };
        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return String((a && (a.message || a)) || ''); }).join(' ');
          if (isWsError(msg)) return;
          origConsoleWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = String((reason && (reason.message || reason)) || '');
          if (isWsError(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          var msg = String(e.message || '');
          if (isWsError(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
